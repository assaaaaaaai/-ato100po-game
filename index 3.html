(()=>{'use strict';
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d',{alpha:false}),overlay=document.querySelector('#overlay'),panel=document.querySelector('#panel');const T=32,W=25,H=20;let viewW=400,viewH=600,scale=1,camX=0,camY=0,now=0,modal=false,combat=null,flash=0,shake=0,stepsCost=0;const saveKey='ato100_chapter1_plus_v1';const defaults={x:12,y:11,dir:2,room:'village',steps:100,hp:30,shards:0,flags:{},potions:2,won:false};let st={...defaults,flags:{}};try{let v=JSON.parse(localStorage.getItem(saveKey)||'null');if(v&&typeof v.x==='number'&&v.room)st={...defaults,...v,flags:v.flags||{}}}catch(e){};let lastMove=0;

function save(){try{localStorage.setItem(saveKey,JSON.stringify(st))}catch(e){}}function update(){document.querySelector('#hp').textContent=`♥ ${st.hp}/30　✦ ${st.shards}/3`;document.querySelector('#steps').textContent=`${st.steps} / 100`;document.querySelector('#area').textContent=st.room==='village'?'◇ THE SILENT BELL':`⌂ ${houses.find(h=>h.id===st.room)?.name||'小さな家'}`;document.querySelector('#goal').textContent=st.won?'第1章クリア！ 鐘の音が戻った':st.shards<3?'時の欠片を3つ集めて時計塔へ':'村の北にいる鐘守ゴーレムを倒そう'}function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.display='none',2100)}function show(title,body,buttons=[['閉じる',close]]){modal=true;overlay.classList.add('show');panel.innerHTML='';let h=document.createElement('h2');h.textContent=title;panel.append(h);let p=document.createElement('p');p.textContent=body;panel.append(p);for(const [label,fn] of buttons){let b=document.createElement('button');b.textContent=label;b.onclick=fn;panel.append(b)}}function close(){modal=false;overlay.classList.remove('show');combat=null}function bump(){shake=5}function cost(n,label){st.steps=Math.max(0,st.steps-n);stepsCost=n;update();save();if(label)toast(`${label}：残り歩数 −${n}`);if(st.steps===0){show('時が止まった','残り歩数が0になった。時の力が世界を巻き戻す……',[['村の入口から再挑戦',()=>{st.steps=100;st.hp=30;st.x=12;st.y=11;st.room='village';close();update();save()}]])}}
function enter(h){st.room=h.id;st.x=7;st.y=9;toast(`${h.name}に入った！`);update();save()}function leave(){st.room='village';let h=houses.find(h=>h.id===leave.from)||houses[0];st.x=h.door[0];st.y=h.door[1]+1;update();save();toast('外に出た')}
function move(dx,dy){if(modal||st.won)return;const t=performance.now();if(t-lastMove<115)return;lastMove=t;st.dir=dx===1?2:dx===-1?1:dy===-1?3:0;let nx=st.x+dx,ny=st.y+dy;if(st.room==='village'){const door=houses.find(h=>h.door[0]===nx&&h.door[1]===ny);if(door){leave.from=door.id;enter(door);return}if(!village[ny]||village[ny][nx]===9||(village[ny][nx]===0&&rng(nx,ny,5)>.62)){bump();return}if(objects.some(o=>o.x===nx&&o.y===ny&&o.type!=='shard'&&!(o.id==='boss'&&st.flags.boss))){bump();return}}else{if(nx===7&&ny===10&&dy===1){leave();return}if(!interior[ny]||interior[ny][nx]===9){bump();return}if(insideObjects.some(o=>o.x===nx&&o.y===ny)){bump();return}}st.x=nx;st.y=ny;cost(1);if(st.room==='village'){const o=objects.find(o=>o.type==='shard'&&!st.flags[o.id]&&o.x===nx&&o.y===ny);if(o)collect(o)}save()}

function interact(){if(modal)return;const list=st.room==='village'?objects:insideObjects;const near=list.filter(o=>Math.abs(o.x-st.x)+Math.abs(o.y-st.y)<=2).sort((a,b)=>(Math.abs(a.x-st.x)+Math.abs(a.y-st.y))-(Math.abs(b.x-st.x)+Math.abs(b.y-st.y)));const o=near[0];if(!o){toast('近くに調べられるものはない');return}if(o.type==='shard'){if(st.flags[o.id])toast('ここにはもう何もない');else collect(o);return}if(o.id==='boss'){if(st.flags.boss){toast('鐘守は静かに眠っている');return}if(st.shards<3){show('鐘守ゴーレム','「三つの欠片が揃わぬうちは、鐘は鳴らせぬ……」',[['戻る',close]]);return}startBattle();return}if(o.id==='mio'){show('少女ミオ','「時計が止まってから、みんな笑わなくなっちゃった。\nでもね、あなたならきっと鐘を鳴らせると思うの」',[['ありがとう',close]]);return}if(o.id==='toki'){show('時計の妖精トキ','「アオ！ 3つの時の欠片を集めて。\n家の中も入れるよ。扉の前へ歩いてみて！」',[['わかった！',close]]);return}if(o.id==='indoorChest'){if(st.flags['chest_'+st.room])toast('宝箱は空っぽだ');else{st.flags['chest_'+st.room]=true;st.potions++;save();show('宝箱を開けた！','回復薬を1つ手に入れた！',[['閉じる',close]])}return}if(o.id==='indoorNpc'){let text=st.room==='elder'?'「時は奪われたのではない。誰かが止めたのじゃ……」':st.room==='clock'?'「鐘の音は村の記憶そのもの。どうか取り戻して」':st.room==='shop'?'「旅の準備は大切よ。そこの宝箱を開けてね」':'「外は危ないから、歩数を大切にね」';show('家の住人',text,[['またね',close]]);return}}
let audio=null,playing=false,musicTimer=null,beat=0;const melody={field:[0,2,4,7,4,2,0,-3,0,2,5,9,7,5,2,0],inside:[0,4,7,4,2,5,9,5],battle:[0,0,7,6,0,0,10,7,5,5,12,10,7,5,3,2]};function note(freq,when,dur,type='triangle',vol=.045){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,when);g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(vol,when+.015);g.gain.exponentialRampToValueAtTime(.0001,when+dur);o.connect(g);g.connect(audio.destination);o.start(when);o.stop(when+dur+.02)}function tickMusic(){if(!playing||!audio)return;const battle=!!combat,inside=st.room!=='village',seq=melody[battle?'battle':inside?'inside':'field'],base=battle?196:inside?220:261.63;let n=seq[beat%seq.length],t=audio.currentTime+.025;note(base*Math.pow(2,n/12),t,battle?.17:.28,battle?'sawtooth':'triangle',battle?.035:.045);if(beat%2===0)note(base/2,t,.3,'sine',.04);if(battle&&beat%4===0)note(65,t,.07,'square',.012);beat++}function toggleMusic(){try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();audio.resume();playing=!playing;clearInterval(musicTimer);if(playing){beat=0;tickMusic();musicTimer=setInterval(tickMusic,combat?180:270)}document.querySelector('#sound').innerHTML=playing?'♫<br>音 ON':'♫<br>音 OFF'}catch(e){toast('この環境では音声を再生できません')}}function setTempo(){if(playing){clearInterval(musicTimer);beat=0;tickMusic();musicTimer=setInterval(tickMusic,combat?180:270)}}
function startBattle(){combat={hp:46,max:46,turn:0,guard:false};setTempo();battleView('時の鐘を守る機械が目覚めた！')}function battleView(msg){if(!combat)return;modal=true;overlay.classList.add('show');panel.innerHTML=`<h2>⚔ 鐘守ゴーレム</h2><div id="enemyArt"><canvas width="80" height="80"></canvas></div><div class="bar"><i style="width:${100*combat.hp/combat.max}%"></i></div><p class="meta">敵 HP ${combat.hp}/${combat.max}　｜　アオ HP ${st.hp}/30</p><p>${msg}</p><p class="meta">次の敵行動：${combat.turn%3===2?'⚡ 強攻撃（11ダメージ）':'⚔ 通常攻撃（5ダメージ）'}<br><strong style="color:#ffe3a4">戦闘コマンド1回につき残り歩数 −2</strong>（移動とは別に消費）</p><div id="choices"></div>`;drawBoss(panel.querySelector('canvas').getContext('2d'));let choices=panel.querySelector('#choices');for(const [txt,fn] of [['⚔ 攻撃',()=>turn(9,false)],['✦ 時の斬撃',()=>turn(15,false)],['🛡 防御',()=>turn(0,true)],['♥ 回復薬 '+st.potions,()=>heal()]] ){let b=document.createElement('button');b.textContent=txt;b.onclick=fn;choices.append(b)}}function heal(){if(st.potions<1){battleView('回復薬がない！');return}st.potions--;st.hp=Math.min(30,st.hp+14);turn(0,false,'回復薬でHPを14回復！')}function turn(damage,guard,msg=''){if(!combat)return;combat.hp=Math.max(0,combat.hp-damage);combat.guard=guard;shake=9;flash=7;st.steps=Math.max(0,st.steps-2);stepsCost=2;update();save();if(combat.hp<=0){st.flags.boss=true;st.won=true;st.steps=Math.min(100,st.steps+30);save();combat=null;setTempo();show('第1章クリア — 鐘の鳴らない村','ゴォォン……！\n止まっていた鐘が、再び世界に響いた。\n少女ミオが初めて笑う。\n\n「アオ、ありがとう。明日が来るって、こんなにうれしいんだね」\n\n第1章・おわり',[['村を歩く',()=>{st.won=false;close();update();save()}]]);return}let enemyDamage=combat.turn%3===2?11:5;enemyDamage=guard?Math.ceil(enemyDamage/4):enemyDamage;st.hp=Math.max(0,st.hp-enemyDamage);combat.turn++;if(st.hp===0||st.steps===0){combat=null;setTempo();show('時の力が尽きた','戦いの中で時間が止まった……。\n村の入口から再挑戦しよう。',[['再挑戦',()=>{st.hp=30;st.steps=100;st.x=12;st.y=11;st.room='village';close();update();save()}]]);return}save();battleView(`${msg|| (guard?'攻撃を防いだ！':`ゴーレムに${damage}ダメージ！`)}\n敵の反撃で${enemyDamage}ダメージ！\n⏳ function drawBoss(c){c.imageSmoothingEnabled=false;const b=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(x,y,w,h)};b(24,6,32,12,'#a49c98');b(18,18,44,40,'#68768d');b(12,24,9,31,'#aeb8c4');b(59,24,9,31,'#aeb8c4');b(25,56,12,17,'#9a9fb0');b(43,56,12,17,'#9a9fb0');b(27,9,7,4,'#f76b82');b(47,9,7,4,'#f76b82');b(26,25,28,27,'#d1b07a');b(29,28,22,21,'#344f71');c.fillStyle='#f7d58c';c.beginPath();c.arc(40,39,10,0,7);c.fill();c.fillStyle='#284365';c.beginPath();c.arc(40,39,7,0,7);c.fill();b(39,33,2,8,'#f7d58c');b(40,39,5,2,'#f7d58c');b(16,28,3,20,'#e0e6e9');b(61,28,3,20,'#e0e6e9')}
function rng(x,y,n=0){let v=Math.sin(x*127.1+y*311.7+n*74.7)*43758.5453;return v-Math.floor(v)}function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}function pixel(x,y,w,h,color){rect(Math.round(x),Math.round(y),w,h,color)}function grass(x,y,tx,ty){let r=rng(tx,ty);rect(x,y,T,T,r>.55?'#367458':'#397c5b');rect(x,y,T,3,'#408969');if(r>.6){pixel(x+6,y+12,3,6,'#88bc79');pixel(x+10,y+16,2,3,'#b2d38a')}if(r<.16){pixel(x+23,y+21,3,3,'#f5d18e');pixel(x+21,y+22,2,3,'#f2b4be')}if(r>.85){pixel(x+3,y+26,3,3,'#5e9c76')}}function path(x,y,tx,ty){rect(x,y,T,T,rng(tx,ty)>.4?'#b9a37c':'#c5af86');rect(x,y,32,2,'#d2bf98');for(let i=0;i<3;i++){let px=3+Math.floor(rng(tx,ty,i+3)*23),py=4+i*9;pixel(x+px,y+py,5,2,i%2?'#a48e6d':'#e2cba2')}}function floor(x,y,tx,ty){rect(x,y,32,32,rng(tx,ty)>.5?'#9e7755':'#aa815d');rect(x,y,32,2,'#bd936e');rect(x+3,y+28,10,2,'#795b48')}
function tree(x,y,tx,ty){let r=rng(tx,ty);rect(x+13,y+18,7,13,'#614833');rect(x+8,y+8,18,19,'#1d503f');rect(x+4,y+10,24,12,'#255d46');rect(x+7,y+3,18,18,r>.5?'#39815a':'#337751');rect(x+12,y+1,12,7,'#5b9a68');rect(x+7,y+7,5,6,'#6da67a');rect(x+20,y+12,4,3,'#80b785');rect(x+14,y+19,8,4,'#265d46')}
function house(h){let x=h.x*T,y=h.y*T,w=h.w*T;rect(x+5,y+36,w-10,91,'#1c3131');rect(x+10,y+34,w-20,80,'#cba77c');rect(x+13,y+46,w-26,63,'#e0bb8e');for(let k=0;k<5;k++)rect(x+15+k*22,y+58+(k%2)*16,7,2,'#b48966');rect(x,y+30,w,11,'#583c43');rect(x+6,y+15,w-12,25,'#9d5554');rect(x+15,y+5,w-30,17,'#b86c61');rect(x+30,y,w-60,10,'#c8816a');rect(x+18,y+77,22,25,'#6b504a');rect(x+21,y+80,16,17,'#70b9c7');rect(x+w-40,y+77,22,25,'#6b504a');rect(x+w-37,y+80,16,17,'#70b9c7');rect(x+w/2-13,y+91,26,30,'#624d4c');rect(x+w/2-9,y+95,18,26,'#3e3440');rect(x+w/2+4,y+109,3,3,'#e3bd79');rect(x+5,y+118,w-10,6,'#795a4d')}
function hero(x,y,t){const moving=performance.now()-lastMove<150;let swing=moving?Math.sin(t/65)*3:0;const px=Math.round(x-12),py=Math.round(y-24);rect(px+2,py+28,24,4,'#142b31a0');pixel(px+8,py+0,14,5,'#1b314b');pixel(px+5,py+5,20,5,'#233f65');pixel(px+3,py+10,24,6,'#1b3555');pixel(px+6,py+15,18,12,'#f4c69e');pixel(px+5,py+17,5,5,'#1e3147');pixel(px+18,py+17,5,5,'#1e3147');pixel(px+11,py+18,3,4,'#fff');pixel(px+19,py+18,3,4,'#fff');pixel(px+12,py+19,2,3,'#28436a');pixel(px+20,py+19,2,3,'#28436a');pixel(px+11,py+25,12,2,'#b97b72');pixel(px+5,py+27,22,13,'#3879b0');pixel(px+9,py+28,13,10,'#81c8ed');pixel(px+12,py+30,8,5,'#d7f3ed');pixel(px+2,py+29,5,12,'#f1bd94');pixel(px+27,py+29,5,12,'#e9b78c');pixel(px+8,py+40+swing,7,7,'#1d3c65');pixel(px+20,py+40-swing,7,7,'#1d3c65');pixel(px+7,py+45+swing,8,3,'#1a2537');pixel(px+19,py+45-swing,8,3,'#1a2537');pixel(px+4,py+31,2,12,'#d4dce6');pixel(px+3,py+40,4,3,'#d9b976')}
function npc(x,y,color){rect(x-9,y-25,18,8,color);rect(x-8,y-17,16,12,'#f0c5a2');rect(x-10,y-5,20,15,color);rect(x-7,y+10,6,7,'#343c64');rect(x+2,y+10,6,7,'#343c64');rect(x-4,y-15,2,3,'#30354b');rect(x+3,y-15,2,3,'#30354b')}
function render(t){now=t;const dpr=Math.min(2,devicePixelRatio||1),w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=false;scale=Math.max(1.15,Math.min(2.25,w/390*1.55));viewW=w/scale;viewH=h/scale;ctx.save();ctx.scale(scale,scale);let map=st.room==='village'?village:interior,mw=map[0].length,mh=map.length;let targetX=st.x*T-viewW/2+16,targetY=st.y*T-viewH/2+16;camX+=(Math.max(0,Math.min(mw*T-viewW,targetX))-camX)*.18;camY+=(Math.max(0,Math.min(mh*T-viewH,targetY))-camY)*.18;let jitter=shake>0?(Math.random()-.5)*shake:0;shake*=.75;ctx.translate(-Math.floor(camX)+jitter,-Math.floor(camY)+jitter);rect(0,0,mw*T,mh*T,'#274b46');let x0=Math.max(0,Math.floor(camX/T)-1),x1=Math.min(mw,Math.ceil((camX+viewW)/T)+2),y0=Math.max(0,Math.floor(camY/T)-1),y1=Math.min(mh,Math.ceil((camY+viewH)/T)+2);for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){let v=map[y][x],xx=x*T,yy=y*T;if(st.room==='village'){if(v===1)path(xx,yy,x,y);else grass(xx,yy,x,y);if(v===0&&rng(x,y,5)>.62)tree(xx,yy,x,y)}else{floor(xx,yy,x,y);if(v===9){rect(xx,yy,32,32,'#6a4c41');rect(xx,yy,32,4,'#b48965')}}}if(st.room==='village'){for(const h of houses)house(h);for(const o of objects){if(o.type==='shard'&&!st.flags[o.id]){let xx=o.x*T+16,yy=o.y*T+15;ctx.fillStyle='#fbe3a3';ctx.globalAlpha=.18+.1*Math.sin(t/350);ctx.beginPath();ctx.arc(xx,yy,15,0,7);ctx.fill();ctx.globalAlpha=1;rect(xx-4,yy-8,8,16,'#f5df9b');rect(xx-8,yy-4,16,8,'#f8f2c4');rect(xx-3,yy-3,6,6,'#fff')}}}else{for(const [x,y,w,h] of indoorBlocks){rect(x*T+2,y*T+4,w*T-4,h*T-5,'#674d3e');rect(x*T+7,y*T+8,w*T-14,8,'#c69c6b');rect(x*T+8,y*T+22,w*T-16,10,'#876448')}rect(6*T,8*T,24,18,st.flags['chest_'+st.room]?'#716154':'#b98a4b');rect(6*T+3,8*T+3,18,5,'#e9c17b');npc(7*T+16,4*T+22,'#8a719e')}let actors=st.room==='village'?objects.filter(o=>o.type==='npc'||(o.type==='boss'&&!st.flags.boss)).map(o=>({y:o.y*T+23,x:o.x*T+16,type:o.id})):[];actors.push({x:st.x*T+16,y:st.y*T+23,type:'hero'});actors.sort((a,b)=>a.y-b.y);for(const a of actors){if(a.type==='hero')hero(a.x,a.y,t);else if(a.type==='boss'){npc(a.x,a.y,'#737b8e');rect(a.x-11,a.y-33,22,9,'#a8a7a5')}else npc(a.x,a.y,a.type==='mio'?'#b68ba7':'#76bdc5')}ctx.restore();if(flash>0){ctx.fillStyle=`rgba(255,238,172,${flash/30})`;ctx.fillRect(0,0,w,h);flash--}requestAnimationFrame(render)}
function reset(){if(confirm('最初からやり直しますか？')){st={...defaults,flags:{}};camX=camY=0;save();update();toast('冒険を最初から開始')}}document.querySelectorAll('[data-dir]').forEach(b=>{let [dx,dy]=b.dataset.dir.split(',').map(Number);b.addEventListener('pointerdown',e=>{e.preventDefault();move(dx,dy)});b.addEventListener('click',e=>e.preventDefault())});document.querySelector('#talk').onclick=interact;document.querySelector('#act').onclick=interact;document.querySelector('#sound').onclick=toggleMusic;document.querySelector('#quest').onclick=()=>show('冒険の記録',`現在地：${st.room==='village'?'鐘の鳴らない村':'家の中'}\n時の欠片：${st.shards}/3\n残り歩数：${st.steps}\n回復薬：${st.potions}個\n\n家の扉へ進むと中に入れます。\n戦闘ではコマンド1回につき2歩消費します。\nゲームは自動保存されます。`,[['閉じる',close],['最初から',()=>{close();reset()}]]);window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.repeat)return;let d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};if(d[e.key])move(...d[e.key]);if(e.key===' '||e.key==='Enter')interact()});update();requestAnimationFrame(render);setTimeout(()=>{if(!st.flags.intro){st.flags.intro=true;save();show('あと100歩の世界','世界から、明日が消えた。\n\n鐘が鳴らなくなった村で、アオは100歩だけの時間を授かった。\n\n村に散らばる3つの時の欠片を探し、鐘守を目覚めさせよう。\n\n家の扉に向かって歩けば中に入れる。',[['冒険を始める',close]])}},300);
})();</script></body></html>

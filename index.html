const tower=`<g><path d="M137 46H183V70H196V171H124V70H137Z" fill="url(#stone${i})" stroke="#211f32" stroke-width="4"/><path d="M131 47L160 17 190 47Z" fill="#41304b" stroke="#d0a475" stroke-width="3"/><path d="M145 113H175V171H145Z" fill="#292738"/><circle cx="160" cy="77" r="20" fill="#242a42" stroke="#d6b77e" stroke-width="5"/><circle cx="160" cy="77" r="2" fill="#fff3c5"/><path class="anim-clockhand" d="M160 77V62M160 77L172 83" stroke="#ffe8a8" stroke-width="3" stroke-linecap="round"/></g>`;
const hero=`<g class="anim-hero"><ellipse cx="83" cy="170" rx="21" ry="5" fill="#071423" opacity=".5"/><path d="M76 130L89 130 94 160 83 159 80 145 76 161 66 159Z" fill="#203d5c" stroke="#102338" stroke-width="2"/><path d="M72 119L91 119 95 143 70 143Z" fill="#3b87a4" stroke="#173a5c" stroke-width="3"/><path d="M72 127L92 128" stroke="#e2c68c" stroke-width="3"/><path d="M72 106Q83 97 95 107L93 123 74 123Z" fill="#efc6a0"/><path d="M70 108L74 97 83 92 96 99 99 114 92 108 90 104 75 111Z" fill="#193d68"/><path d="M94 123L105 126 111 120 113 127 102 134 92 131" fill="#a52f49"/><path d="M96 137L110 113" stroke="#e9d3a5" stroke-width="3"/><path d="M110 113L115 105" stroke="#d5f4ff" stroke-width="4"/></g>`;
let content='',label='';
if(i===0){label='鐘が鳴り、人々が歩く。雲は流れ、朝が訪れる。';content=`<circle class="anim-sun" cx="256" cy="85" r="35" fill="#ffd18c" opacity=".8"/>${tower}${ground}<g class="anim-people"><circle cx="42" cy="141" r="8" fill="#e9c39e"/><path d="M34 149H50L54 174H29Z" fill="#c55c68"/><circle cx="230" cy="140" r="8" fill="#eac39e"/><path d="M222 148H238L241 174H218Z" fill="#4c8aa3"/></g><g class="anim-bell"><path d="M150 40Q160 34 170 40L174 54H146Z" fill="#f4c57a"/><circle cx="160" cy="57" r="4" fill="#fff2bd"/></g>`}
if(i===1){label='鐘が砕け、時計の針が止まる。破片が宙へ散る。';content=`${tower}${ground}<path d="M160 18L145 70 172 90 150 138 174 174" stroke="#d1e7ff" stroke-width="4" fill="none" opacity=".9"/><g class="anim-shatter" fill="#ffdbab"><path d="M203 63l10 -20 13 22 -16 15z"/><path d="M220 101l21 -10 9 19 -25 9z"/></g><g class="anim-shatter rev" fill="#c1d8fa"><path d="M107 63l-18 -18 -8 25 17 10z"/><path d="M115 114l-23 2 10 21 20 -9z"/></g><path d="M0 0H320V190H0Z" fill="#251a3c" opacity=".23"/>`}
if(i===2){label='止まった村をアオが歩く。妖精トキが光を放つ。';content=`${tower}${ground}${hero}<g class="anim-fairy"><circle cx="201" cy="99" r="10" fill="#fff5c5"/><ellipse cx="190" cy="91" rx="13" ry="6" fill="#bceeff" opacity=".8"/><ellipse cx="213" cy="91" rx="13" ry="6" fill="#bceeff" opacity=".8"/><circle cx="201" cy="99" r="20" fill="none" stroke="#ffeb9d" opacity=".45" stroke-width="3"/></g><g class="anim-particles" fill="#fff0b1"><circle cx="226" cy="69" r="3"/><circle cx="185" cy="55" r="2"/><circle cx="250" cy="114" r="2"/></g>`}
if(i===3){label='三つの時の欠片が輝き、鐘塔の空に朝日が昇る。';content=`<g class="anim-ray" style="transform-origin:160px 82px"><path d="M160 82L-40 -80 360 -80Z" fill="#f5d59c" opacity=".25"/><path d="M160 82L-60 180 380 180Z" fill="#f5d59c" opacity=".19"/></g><circle class="anim-sun" cx="160" cy="91" r="49" fill="#ffd8a0" opacity=".62"/>${tower}${ground}${hero}<g class="anim-particles" fill="#fff4c4"><path d="M74 60l10 -16 10 16 -10 16z"/><path d="M234 70l10 -16 10 16 -10 16z"/><path d="M260 120l10 -16 10 16 -10 16z"/></g>`}
return `<div class="bookScene" data-scene="${i}">${svgHead}${content}</svg><div class="sceneLabel">${label}</div></div>`;
}
function leafHTML(i){const sc=storyScenes[i];return `<div class="bookLeaf"><div class="bookNum">THE WORLD OF LAST STEPS　・　${String(i+1).padStart(2,'0')}</div><div class="bookTitle">${sc.title}</div>${bookSceneArt(i)}<div class="bookText">${sc.text}</div><div class="bookFoot">✦　${i+1} / ${storyScenes.length}　✦</div></div>`}
function renderStory(){if(!storyPlaying)return;const root=document.querySelector('#frontContent');root.innerHTML=`<div class="bookHeading">✦ PROLOGUE ・ 時の書 ✦</div><div class="bookShell"><div class="bookCover"><div class="bookPages" id="bookPages">${leafHTML(sceneIndex)}</div></div></div><div class="bookActions"><button id="prevPage" ${sceneIndex===0?'disabled':''}>◀ 前のページ</button><button id="nextPage" class="primary">${sceneIndex===storyScenes.length-1?'本を閉じて冒険へ ✦':'次のページ ▶'}</button></div><div class="bookHint">自分のペースでページをめくろう ・ 左右スワイプ対応</div><button id="skipStory" style="background:transparent;border:0;box-shadow:none;font-size:12px;padding:8px;margin-top:5px">物語をスキップ</button>`;
root.querySelector('#prevPage').onclick=()=>turnBook(-1);root.querySelector('#nextPage').onclick=()=>sceneIndex===storyScenes.length-1?finishStory():turnBook(1);root.querySelector('#skipStory').onclick=finishStory;
let x0=null;const pages=root.querySelector('#bookPages');pages.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});pages.addEventListener('touchend',e=>{if(x0===null)return;let dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>45)turnBook(dx<0?1:-1)},{passive:true});}
function turnBook(dir){if(!storyPlaying||bookTurning)return;const next=sceneIndex+dir;if(next<0||next>=storyScenes.length)return;bookTurning=true;sfx('page');const pages=document.querySelector('#bookPages');const old=pages.querySelector('.bookLeaf');const incoming=document.createElement('div');incoming.innerHTML=leafHTML(next);const newLeaf=incoming.firstElementChild;if(dir>0){pages.append(newLeaf);pages.append(old);old.classList.add('turnOut')}else{pages.append(newLeaf);newLeaf.classList.add('turnIn')}
frontTimer=setTimeout(()=>{sceneIndex=next;bookTurning=false;renderStory()},690)}
function finishStory(){clearFrontTimer();storyPlaying=false;bookTurning=false;document.querySelector('#front').classList.remove('bookMode');st={...defaults,flags:{intro:true}};combat=null;camX=camY=0;save();update();updateAction();document.querySelector('#front').classList.add('hidden');setTempo();sfx('bell');toast('冒険の始まり。残された100歩を大切に！')}

function reset(){if(confirm('ニューゲームとして最初から始めますか？')){showTitle()}}document.querySelectorAll('[data-dir]').forEach(b=>{let [dx,dy]=b.dataset.dir.split(',').map(Number),repeat=null,downAt=0;
 const stop=()=>{if(repeat!==null){clearInterval(repeat);repeat=null}};
 b.addEventListener('pointerdown',e=>{e.preventDefault();downAt=performance.now();stop();move(dx,dy);repeat=setInterval(()=>move(dx,dy),145);try{b.setPointerCapture(e.pointerId)}catch(_){} });
 b.addEventListener('pointerup',stop);b.addEventListener('pointercancel',stop);b.addEventListener('lostpointercapture',stop);
 b.addEventListener('click',e=>{e.preventDefault();if(!downAt)move(dx,dy)});
});document.querySelector('#talk').onclick=interact;document.querySelector('#act').onclick=action;document.querySelector('#sound').onclick=toggleMusic;document.querySelector('#quest').onclick=()=>show('冒険の記録',`現在地：${st.room==='village'?'鐘の鳴らない村':'家の中'}\n時の欠片：${st.shards}/3\n残り歩数：${st.steps}\n回復薬：${st.potions}個\n\n家の扉の前で「入る」、室内の出口で「出る」を押します。\n戦闘：攻撃−2歩／時のシンザン−5歩／防御−1歩／回復−2歩。\nゲームは自動保存されます。`,[['閉じる',close],['村の中央に戻る',()=>{close();st.room='village';st.x=12;st.y=11;camX=camY=0;save();update();toast('村の中央に移動した！')}],['タイトルへ',()=>{close();showTitle()}],['最初から',()=>{close();reset()}]]);window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.repeat)return;let d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};if(d[e.key])move(...d[e.key]);if(e.key===' '||e.key==='Enter')action()});rescueSave();update();updateAction();requestAnimationFrame(render);showTitle();
})();</script></body></html>

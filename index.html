(()=>{'use strict';
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d',{alpha:false}),overlay=document.querySelector('#overlay'),panel=document.querySelector('#panel');const T=32,W=25,H=20;let viewW=400,viewH=600,scale=1,camX=0,camY=0,now=0,modal=false,combat=null,flash=0,shake=0,stepsCost=0;const saveKey='ato100_chapter1_plus_v1';const defaults={x:12,y:11,dir:2,room:'village',steps:100,hp:30,shards:0,flags:{},potions:2,won:false};let st={...defaults,flags:{}};try{let v=JSON.parse(localStorage.getItem(saveKey)||'null');if(v&&typeof v.x==='number'&&v.room)st={...defaults,...v,flags:v.flags||{}}}catch(e){};let lastMove=0,blockedCount=0,walkTicks=0;

const interior=Array.from({length:12},(_,y)=>Array.from({length:14},(_,x)=>x===0||y===0||x===13||y===11?9:2));interior[10][7]=3;const indoorBlocks=[[2,2,3,2],[9,2,3,2],[2,6,3,2],[9,6,3,2]];for(const [x,y,w,h] of indoorBlocks)for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)interior[j][i]=9;

function save(){try{localStorage.setItem(saveKey,JSON.stringify(st))}catch(e){}}function update(){document.querySelector('#hp').textContent=`♥ ${st.hp}/30　✦ ${st.shards}/3`;document.querySelector('#steps').textContent=`${st.steps} / 100`;document.querySelector('#loc').textContent=`アオ ${st.room==='village'?'村':'室内'} (${st.x},${st.y})`; document.querySelector('#area').textContent=st.room==='village'?'◇ THE SILENT BELL • V1.1':`⌂ ${houses.find(h=>h.id===st.room)?.name||'小さな家'}`;document.querySelector('#goal').textContent=st.won?'第1章クリア！ 鐘の音が戻った':st.shards<3?'時の欠片を3つ集めて時計塔へ':'村の北にいる鐘守ゴーレムを倒そう'}function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.display='none',2100)}function show(title,body,buttons=[['閉じる',close]]){modal=true;overlay.classList.add('show');panel.innerHTML='';let h=document.createElement('h2');h.textContent=title;panel.append(h);let p=document.createElement('p');p.textContent=body;panel.append(p);for(const [label,fn] of buttons){let b=document.createElement('button');b.textContent=label;b.onclick=fn;panel.append(b)}}function close(){modal=false;overlay.classList.remove('show');combat=null}function bump(){shake=5;blockedCount++;toast('ここは通れない！ 道を回って進もう');}function cost(n,label){st.steps=Math.max(0,st.steps-n);stepsCost=n;update();save();if(label)toast(`${label}：残り歩数 −${n}`);if(st.steps===0){show('時が止まった','残り歩数が0になった。時の力が世界を巻き戻す……',[['村の入口から再挑戦',()=>{st.steps=100;st.hp=30;st.x=12;st.y=11;st.room='village';close();update();save()}]])}}

function move(dx,dy){if(modal||st.won||!document.querySelector('#front').classList.contains('hidden'))return;const t=performance.now();if(t-lastMove<85)return;lastMove=t;st.dir=dx===1?2:dx===-1?1:dy===-1?3:0;let nx=st.x+dx,ny=st.y+dy;if(st.room==='village'){const door=houses.find(h=>h.door[0]===nx&&h.door[1]===ny);if(door){leave.from=door.id;enter(door);return}if(!village[ny]||nx<0||nx>=W||village[ny][nx]===9||(village[ny][nx]===0&&rng(nx,ny,5)>.62)){bump();return}if(objects.some(o=>o.x===nx&&o.y===ny&&o.type!=='shard'&&!(o.id==='boss'&&st.flags.boss))){bump();return}}else{if(nx===7&&ny===10&&dy===1){leave();return}if(!interior[ny]||nx<0||nx>=14||interior[ny][nx]===9){bump();return}if(insideObjects.some(o=>o.x===nx&&o.y===ny)){bump();return}}st.x=nx;st.y=ny;walkTicks++;cost(1);if(st.room==='village'){const o=objects.find(o=>o.type==='shard'&&!st.flags[o.id]&&o.x===nx&&o.y===ny);if(o)collect(o)}save()}

function interact(){if(modal)return;const list=st.room==='village'?objects:insideObjects;const near=list.filter(o=>Math.abs(o.x-st.x)+Math.abs(o.y-st.y)<=2).sort((a,b)=>(Math.abs(a.x-st.x)+Math.abs(a.y-st.y))-(Math.abs(b.x-st.x)+Math.abs(b.y-st.y)));const o=near[0];if(!o){toast('近くに調べられるものはない');return}if(o.type==='shard'){if(st.flags[o.id])toast('ここにはもう何もない');else collect(o);return}if(o.id==='boss'){if(st.flags.boss){toast('鐘守は静かに眠っている');return}if(st.shards<3){show('鐘守ゴーレム','「三つの欠片が揃わぬうちは、鐘は鳴らせぬ……」',[['戻る',close]]);return}startBattle();return}if(o.id==='mio'){sfx('talk');show('少女ミオ','「時計が止まってから、みんな笑わなくなっちゃった。\nでもね、あなたならきっと鐘を鳴らせると思うの」',[['ありがとう',close]]);return}if(o.id==='toki'){sfx('talk');show('時計の妖精トキ','「アオ！ 3つの時の欠片を集めて。\n家の中も入れるよ。扉の前へ歩いてみて！」',[['わかった！',close]]);return}if(o.id==='indoorChest'){if(st.flags['chest_'+st.room])toast('宝箱は空っぽだ');else{st.flags['chest_'+st.room]=true;st.potions++;save();sfx('chest');show('宝箱を開けた！','回復薬を1つ手に入れた！',[['閉じる',close]])}return}if(o.id==='indoorNpc'){sfx('talk');let text=st.room==='elder'?'「時は奪われたのではない。誰かが止めたのじゃ……」':st.room==='clock'?'「鐘の音は村の記憶そのもの。どうか取り戻して」':st.room==='shop'?'「旅の準備は大切よ。そこの宝箱を開けてね」':'「外は危ないから、歩数を大切にね」';show('家の住人',text,[['またね',close]]);return}}

function ensureAudio(){try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return true}catch(e){return false}}

 const px=st.x*T+16,py=st.y*T+23;
 ctx.save();

 ctx.fillStyle='#f8d78b';ctx.beginPath();ctx.ellipse(px,py+1,12,4,0,0,Math.PI*2);ctx.fill();

 ctx.strokeStyle='#142d43';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(px,py+1,14,6,0,0,Math.PI*2);ctx.stroke();
 ctx.strokeStyle='#fce5a3';ctx.lineWidth=1.6;ctx.beginPath();ctx.ellipse(px,py+1,14,6,0,0,Math.PI*2);ctx.stroke();
 ctx.restore();
 hero(px,py,t);
 // small golden quest pointer over hero
 const bob=Math.round(Math.sin(t/280)*3);
 rect(px-3,py-59+bob,7,4,'#fff2bd');rect(px-2,py-55+bob,5,3,'#e7b96c');rect(px-1,py-52+bob,3,3,'#b27c46');

function render(t){now=t;const dpr=Math.min(2,devicePixelRatio||1),w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=false;scale=Math.max(1.15,Math.min(2.25,w/390*1.55));viewW=w/scale;viewH=h/scale;ctx.save();ctx.scale(scale,scale);let map=st.room==='village'?village:interior,mw=map[0].length,mh=map.length;let targetX=st.x*T-viewW/2+16,targetY=st.y*T-viewH/2+16;camX+=(Math.max(0,Math.min(mw*T-viewW,targetX))-camX)*.18;camY+=(Math.max(0,Math.min(mh*T-viewH,targetY))-camY)*.18;let jitter=shake>0?(Math.random()-.5)*shake:0;shake*=.75;ctx.translate(-Math.floor(camX)+jitter,-Math.floor(camY)+jitter);rect(0,0,mw*T,mh*T,'#274b46');let x0=Math.max(0,Math.floor(camX/T)-1),x1=Math.min(mw,Math.ceil((camX+viewW)/T)+2),y0=Math.max(0,Math.floor(camY/T)-1),y1=Math.min(mh,Math.ceil((camY+viewH)/T)+2);for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){let v=map[y][x],xx=x*T,yy=y*T;if(st.room==='village'){if(v===1)path(xx,yy,x,y);else grass(xx,yy,x,y);if(v===0&&rng(x,y,5)>.62)tree(xx,yy,x,y);if(v!==9)details(x,y,v,t)}else{floor(xx,yy,x,y);if(v===9){rect(xx,yy,32,32,'#6a4c41');rect(xx,yy,32,4,'#b48965')}}}if(st.room==='village'){for(const h of houses){ctx.save();if(st.x>=h.x-1&&st.x<=h.x+h.w&&st.y>=h.y-1&&st.y<=h.y+h.h+1)ctx.globalAlpha=.78;house(h);ctx.restore();}
 // street lanterns, signposts, wildflower borders and drifting fireflies
 for(const [lx,ly] of [[9,7],[15,7],[9,15],[15,15]]){let xx=lx*T,yy=ly*T;rect(xx+13,yy+11,5,19,'#493f3c');rect(xx+11,yy+6,9,9,'#8d6749');rect(xx+13,yy+7,5,6,'#ffe2a0');rect(xx+10,yy+4,11,3,'#3d4952');ctx.globalAlpha=.12+.05*Math.sin(t/300+lx);ctx.fillStyle='#ffd48a';ctx.beginPath();ctx.arc(xx+16,yy+12,22,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
 for(let i=0;i<16;i++){let fx=(2+i*7)%24,fy=(3+i*11)%18;if(village[fy]?.[fx]===0&&rng(fx,fy,5)<=.62){let xx=fx*T+8,yy=fy*T+16;rect(xx,yy,2,8,'#3e794b');rect(xx-3,yy+1,8,4,i%3?'#f5b2c0':'#f4df9e');rect(xx,yy,2,3,'#fff3c9')}}
 for(const o of objects){if(o.type==='shard'&&!st.flags[o.id]){let xx=o.x*T+16,yy=o.y*T+15;ctx.fillStyle='#fbe3a3';ctx.globalAlpha=.18+.1*Math.sin(t/350);ctx.beginPath();ctx.arc(xx,yy,15,0,7);ctx.fill();ctx.globalAlpha=1;rect(xx-4,yy-8,8,16,'#f5df9b');rect(xx-8,yy-4,16,8,'#f8f2c4');rect(xx-3,yy-3,6,6,'#fff')}}}else{for(const [x,y,w,h] of indoorBlocks){rect(x*T+2,y*T+4,w*T-4,h*T-5,'#674d3e');rect(x*T+7,y*T+8,w*T-14,8,'#c69c6b');rect(x*T+8,y*T+22,w*T-16,10,'#876448')}rect(6*T,8*T,24,18,st.flags['chest_'+st.room]?'#716154':'#b98a4b');rect(6*T+3,8*T+3,18,5,'#e9c17b');npc(7*T+16,4*T+22,'#8a719e')}let actors=st.room==='village'?objects.filter(o=>o.type==='npc'||(o.type==='boss'&&!st.flags.boss)).map(o=>({y:o.y*T+23,x:o.x*T+16,type:o.id})):[];actors.push({x:st.x*T+16,y:st.y*T+23,type:'hero'});actors.sort((a,b)=>a.y-b.y);for(const a of actors){if(a.type==='hero')continue;else if(a.type==='boss'){npc(a.x,a.y,'#737b8e');rect(a.x-11,a.y-33,22,9,'#a8a7a5')}else npc(a.x,a.y,a.type==='mio'?'#b68ba7':'#76bdc5')}if(st.room==='village')ambient(t);drawPlayerFocus(t);ctx.restore();if(flash>0){ctx.fillStyle=`rgba(255,238,172,${flash/30})`;ctx.fillRect(0,0,w,h);flash--}requestAnimationFrame(render)}
function isSafe(x,y){return !!village[y] && village[y][x]!==9 && !(village[y][x]===0&&rng(x,y,5)>.62) && !objects.some(o=>o.x===x&&o.y===y&&o.type!=='shard'&&!(o.id==='boss'&&st.flags.boss));}
function rescueSave(){
 if(st.room==='village'&&!isSafe(st.x,st.y)){
   const ox=st.x,oy=st.y;let found=null;
   for(let r=0;r<25&&!found;r++)for(let y=1;y<H-1&&!found;y++)for(let x=1;x<W-1;x++)if(Math.abs(x-ox)+Math.abs(y-oy)===r&&isSafe(x,y)){found=[x,y];break}
   if(found){st.x=found[0];st.y=found[1];save();}
 }
 if(st.room!=='village'&&(!interior[st.y]||interior[st.y][st.x]===9)){st.x=7;st.y=9;save()}
}

let frontTimer=null,sceneIndex=0,storyPlaying=false;
const storyScenes=[
{title:'第一幕 ― 最後の鐘',text:'かつて、この世界には\n毎朝、明日を告げる鐘が鳴っていた。'},
{title:'第二幕 ― 止まった時間',text:'ある夜、鐘の音が途絶えた。\n風も、時計も、人々の笑顔も止まった。'},
{title:'第三幕 ― たった百歩',text:'ただ一人、少年アオだけが動けた。\n妖精トキが告げる。\n「君に残された時間は、あと100歩」'},
{title:'第四幕 ― 約束',text:'散らばった三つの時の欠片を集め、\n鐘をもう一度鳴らす。\nそれが、明日を取り戻す唯一の道。'}
];
function clearFrontTimer(){if(frontTimer){clearTimeout(frontTimer);frontTimer=null}}
function showTitle(){clearFrontTimer();storyPlaying=false;document.querySelector('#front').classList.remove('hidden');let hasSave=!!st.flags.intro||st.steps!==100||st.shards>0;try{hasSave=hasSave||!!localStorage.getItem(saveKey)}catch(e){}let root=document.querySelector('#frontContent');root.innerHTML=`<div class="eyebrow">AN ORIGINAL FANTASY RPG</div><div class="clock"><div class="hand"></div><div class="hand small"></div></div><h1>あと100歩の世界</h1><div class="sub">― 鐘の鳴らない村 ―</div><div style="height:25px"></div><button id="newGame" class="primary">✦ ニューゲーム</button><button id="continueGame" ${hasSave?'':'disabled'}>↪ 続きから</button><div class="fine">Ver. 1.1.0 ｜ 自動セーブ対応 ｜ 音声はタップ後に再生</div>`;
root.querySelector('#newGame').onclick=()=>{sfx('confirm');startMusic();beginStory()};root.querySelector('#continueGame').onclick=()=>{sfx('confirm');startMusic();document.querySelector('#front').classList.add('hidden');update();toast('冒険を再開した！')};}
function beginStory(){clearFrontTimer();sceneIndex=0;storyPlaying=true;renderStory()}
function renderStory(){if(!storyPlaying)return;clearFrontTimer();if(sceneIndex>=storyScenes.length){finishStory();return}const sc=storyScenes[sceneIndex];document.querySelector('#frontContent').innerHTML=`<div class="eyebrow">PROLOGUE</div><div class="storyStage"><div class="storyArt scene${sceneIndex}"></div><div class="storyTitle">${sc.title}</div><div class="storyText">${sc.text}</div></div><div class="progress">${sceneIndex+1} / ${storyScenes.length}　•　自動再生中</div><button id="skipStory">スキップして冒険へ</button>`;document.querySelector('#skipStory').onclick=finishStory;frontTimer=setTimeout(()=>{sceneIndex++;renderStory()},sceneIndex===2?5400:4400)}
function finishStory(){clearFrontTimer();storyPlaying=false;st={...defaults,flags:{intro:true}};combat=null;camX=camY=0;save();update();document.querySelector('#front').classList.add('hidden');setTempo();sfx('bell');toast('冒険の始まり。残された100歩を大切に！')}

function reset(){if(confirm('ニューゲームとして最初から始めますか？')){showTitle()}}document.querySelectorAll('[data-dir]').forEach(b=>{let [dx,dy]=b.dataset.dir.split(',').map(Number),repeat=null,downAt=0;
 const stop=()=>{if(repeat!==null){clearInterval(repeat);repeat=null}};
 b.addEventListener('pointerdown',e=>{e.preventDefault();downAt=performance.now();stop();move(dx,dy);repeat=setInterval(()=>move(dx,dy),145);try{b.setPointerCapture(e.pointerId)}catch(_){} });
 b.addEventListener('pointerup',stop);b.addEventListener('pointercancel',stop);b.addEventListener('lostpointercapture',stop);
 b.addEventListener('click',e=>{e.preventDefault();if(performance.now()-downAt>400)move(dx,dy)});
});document.querySelector('#talk').onclick=interact;document.querySelector('#act').onclick=interact;document.querySelector('#sound').onclick=toggleMusic;document.querySelector('#quest').onclick=()=>show('冒険の記録',`現在地：${st.room==='village'?'鐘の鳴らない村':'家の中'}\n時の欠片：${st.shards}/3\n残り歩数：${st.steps}\n回復薬：${st.potions}個\n\n家の扉へ進むと中に入れます。\n戦闘ではコマンド1回につき2歩消費します。\nゲームは自動保存されます。`,[['閉じる',close],['村の中央に戻る',()=>{close();st.room='village';st.x=12;st.y=11;camX=camY=0;save();update();toast('村の中央に移動した！')}],['タイトルへ',()=>{close();showTitle()}],['最初から',()=>{close();reset()}]]);window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.repeat)return;let d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};if(d[e.key])move(...d[e.key]);if(e.key===' '||e.key==='Enter')interact()});rescueSave();update();requestAnimationFrame(render);showTitle();
})();</script></body></html>

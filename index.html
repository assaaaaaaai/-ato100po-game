function battle(name,maxHp,emoji,onWin){
let hp=maxHp,turn=0,energy=0,phase=0;
const escape=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const chapter=state.zone;
function screen(note=''){
 if(hp<=0){close();fanfare();onWin();update();return}
 phase=hp<=maxHp*.5?1:0;
 const heavy=turn%3===2;
 const attack=heavy?(phase?15:12):(phase?7:5);
 const ePct=Math.max(0,Math.round(hp/maxHp*100));
 const pPct=Math.max(0,Math.round(state.hp/30*100));
 const scene=chapter===0?'#283a54':chapter===1?'#1e2d55':'#103f57';
 const enemy=chapter===2?`<svg viewBox="0 0 160 120" width="175" height="135"><path d="M15 80 Q30 10 75 40 Q110 -10 145 70 Q130 115 80 95 Q35 120 15 80" fill="#328eae" stroke="#9de1e3" stroke-width="5"/><path d="M48 65 Q80 40 112 65" fill="none" stroke="#c8ecff" stroke-width="8"/><circle cx="58" cy="74" r="6" fill="#0d344a"/><circle cx="101" cy="74" r="6" fill="#0d344a"/><path d="M78 82Q80 104 93 82" fill="none" stroke="#0d344a" stroke-width="4"/></svg>`:chapter===0?`
 <svg viewBox="0 0 160 120" width="175" height="135" style="image-rendering:pixelated;filter:drop-shadow(0 8px 8px #0009)">
 <rect x="60" y="17" width="40" height="15" fill="#b9a27c"/><rect x="53" y="32" width="54" height="58" fill="#6c758b"/>
 <rect x="47" y="38" width="13" height="45" fill="#a7b0b9"/><rect x="100" y="38" width="13" height="45" fill="#a7b0b9"/>
 <rect x="63" y="44" width="34" height="31" fill="#d8b47c"/><circle cx="80" cy="59" r="12" fill="#586b85"/><path d="M80 50V60L88 65" fill="none" stroke="#ffe3a0" stroke-width="3"/>
 <rect x="63" y="82" width="14" height="24" fill="#7b8296"/><rect x="83" y="82" width="14" height="24" fill="#7b8296"/>
 <rect x="66" y="21" width="8" height="5" fill="#ff777c"/><rect x="87" y="21" width="8" height="5" fill="#ff777c"/>
 </svg>`:`
 <svg viewBox="0 0 160 120" width="175" height="135" style="filter:drop-shadow(0 8px 10px #0009)">
 <path d="M80 6L96 34 125 24 114 58 136 78 102 83 80 112 58 83 24 78 46 58 35 24 64 34Z" fill="#5263a1" stroke="#c1b2fa" stroke-width="4"/>
 <path d="M80 28a32 32 0 1 0 0 64 26 26 0 1 1 0-64" fill="#b8d8f9"/>
 <circle cx="65" cy="59" r="5" fill="#f8c9f6"/><circle cx="96" cy="59" r="5" fill="#f8c9f6"/>
 <circle cx="80" cy="14" r="4" fill="#fff4ae"/>
 </svg>`;
 const body=`<div style="background:linear-gradient(${scene},#111b31);border:2px solid #bda26b;border-radius:12px;padding:10px;margin:8px 0;text-align:center">
 <div style="color:#f8e5ad;font-weight:bold">${escape(name)} ${phase?'⚡ 第二形態':''}</div>
 <div style="height:145px;display:grid;place-items:center;animation:enemyFloat 1.8s ease-in-out infinite">${enemy}</div>
 <div style="height:10px;background:#20283b;border:1px solid #e5c487;border-radius:8px;overflow:hidden"><div style="height:100%;width:${ePct}%;background:linear-gradient(90deg,#e15c76,#ffb271);transition:width .3s"></div></div>
 <div style="color:#fff4d7;font-size:12px">敵 HP ${Math.max(0,hp)} / ${maxHp}</div></div>
 <div class="stats">アオ HP ${state.hp} / 30 <span style="color:#9ef2cb">▰ ${pPct}%</span><br>時の力 ${'✦'.repeat(energy)}${'·'.repeat(3-energy)}<br><span class="gold">次の攻撃：${heavy?'💥 強攻撃':'⚔️ 通常攻撃'}（${attack}ダメージ）</span></div>
 <p style="font-weight:bold">${escape(note||'敵の攻撃予告を見て行動を選ぼう！')}</p>`;
 dialog('⚔️ ボス戦 — '+name,body,[
 ['⚔️ 斬る（6）',()=>act('attack')],
 ['🛡️ 守る（力+1）',()=>act('guard')],
 ['✨ 時の一撃（16）',()=>act('skill')],
 ['💊 回復薬（+10）',()=>act('heal')]
 ]);
}
function act(type){
 let note='',guard=false;
 if(type==='attack'){hp-=6;note='アオの剣が光る！ 敵に6ダメージ！';beep(560,.11,'sawtooth')}
 else if(type==='guard'){guard=true;energy=Math.min(3,energy+1);note='時の盾を展開！ 時の力が1増えた。';beep(360,.15)}
 else if(type==='skill'){if(energy<2){screen('時の力が足りない！ 防御で貯めよう。');return}energy-=2;hp-=16;note='時の一撃！ 16ダメージ！';fanfare()}
 else if(type==='heal'){let i=state.inventory.indexOf('回復薬');if(i<0){screen('回復薬を持っていない！');return}state.inventory.splice(i,1);state.hp=Math.min(30,state.hp+10);note='回復薬でHPを10回復！';beep(660,.2)}
 if(hp<=0){screen(note);return}
 let enraged=hp<=maxHp*.5,heavy=turn%3===2;
 let dmg=heavy?(enraged?15:12):(enraged?7:5);
 if(guard)dmg=Math.ceil(dmg/4);
 state.hp-=dmg;turn++;
 note+=' '+name+'の'+(heavy?'大技！':'攻撃！')+' '+dmg+'ダメージ。';
 if(enraged&&phase===0){note+=' ⚡ 番人が第二形態に変化した！';beep(180,.4,'sawtooth')}
 if(state.hp<=0){close();fail('番人の一撃で倒れた。');return}
 update();screen(note)
}
screen('敵の予告を読んで、防御と必殺技を使い分けよう！')
}

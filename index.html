const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id),T=40,W=24,H=20;

try{let a=JSON.parse(localStorage.getItem('ato100_new_v1'));if(a&&Number.isInteger(a.x)&&a.x>=0&&a.x<W&&a.y>=0&&a.y<H&&a.flags&&typeof a.flags==='object'&&Number.isFinite(a.steps)&&a.steps>=0&&a.steps<=101&&Number.isFinite(a.hp)&&a.hp>=0&&a.hp<=30)state={...state,...a}}catch(e){}

for(let y=2;y<H-2;y++)for(let x=2;x<W-2;x++){if((x>=10&&x<=13)||(y>=10&&y<=12)||(y>=15&&x>=8&&x<=16))map[y][x]=1;else if(rand(x,y,1)<.42)map[y][x]=2}

for(let y=8;y<=17;y++)for(let x=10;x<=13;x++)map[y][x]=1;
for(let x=6;x<=18;x++)for(let y=10;y<=12;y++)map[y][x]=1;
const objects=[{id:'well',x:10,y:6,kind:'shard',name:'古い井戸'},{id:'flower',x:18,y:10,kind:'shard',name:'星灯りの花'},{id:'child',x:8,y:11,kind:'npc',name:'少女ミオ'},{id:'bell',x:12,y:3,kind:'boss',name:'止まった時計塔'},{id:'toki',x:13,y:15,kind:'npc',name:'トキ'}];

function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h))}

function tree(x,y,r){rect(x+17,y+26,8,13,'#3b2c37');rect(x+14,y+28,14,4,'#6e5041');for(const [dx,dy,w,h,c] of [[4,10,34,22,'#193f42'],[8,4,28,24,'#24625a'],[13,0,20,14,'#4b8c73'],[3,16,33,8,'#2b6b60'],[13,5,5,4,'#a4cda0'],[24,12,4,3,'#93c69c'],[8,18,5,3,'#86b993']])rect(x+dx,y+dy,w,h,c);if(r>.7)rect(x+26,y+20,3,3,'#f2cf8d')}

function hero(x,y,t){let step=Math.sin(t/110)*2;rect(x-10,y+11,21,5,'#09171d88');rect(x-8,y-12,16,22,'#1a324d');rect(x-9,y-26,18,16,'#26385d');rect(x-7,y-24,15,12,'#f1c39d');rect(x-10,y-29,20,8,'#203755');rect(x-5,y-31,13,5,'#324e74');rect(x-5,y-17,4,4,'#273348');rect(x+4,y-17,4,4,'#273348');rect(x-9,y-9,18,15,'#67b8d4');rect(x-3,y-8,7,9,'#d6edf1');rect(x-10,y+5+step,7,8,'#243655');rect(x+3,y+5-step,7,8,'#243655');rect(x-13,y-8,4,11,'#e7b890');rect(x+9,y-8,4,11,'#e7b890');rect(x-10,y-12,3,8,'#e1c46d')}
function fairy(x,y,t){let b=Math.sin(t/340)*4;rect(x-10,y-10+b,9,10,'#9bdcdd77');rect(x+2,y-12+b,10,11,'#a8e8d977');rect(x-4,y-15+b,9,9,'#f3e0aa');rect(x-6,y-19+b,13,5,'#8cd2c4');rect(x-5,y-5+b,11,12,'#c3a2da');rect(x-2,y+7+b,6,4,'#e4d49d')}
function draw(t){let dpr=Math.min(devicePixelRatio||1,2),cw=canvas.clientWidth,ch=canvas.clientHeight;if(canvas.width!==Math.round(cw*dpr)||canvas.height!==Math.round(ch*dpr)){canvas.width=Math.round(cw*dpr);canvas.height=Math.round(ch*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=false;let px=state.x*T+T/2,py=state.y*T+T/2;cam.x+=(px-cw/2-cam.x)*.14;cam.y+=(py-ch/2-cam.y)*.14;ctx.fillStyle='#132c37';ctx.fillRect(0,0,cw,ch);ctx.save();ctx.translate(-Math.round(cam.x),-Math.round(cam.y));let x0=Math.max(0,Math.floor(cam.x/T)-1),x1=Math.min(W-1,Math.ceil((cam.x+cw)/T)+1),y0=Math.max(0,Math.floor(cam.y/T)-1),y1=Math.min(H-1,Math.ceil((cam.y+ch)/T)+1);for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){let xx=x*T,yy=y*T,r=rand(x,y);rect(xx,yy,T,T,((x+y)%2?'#315c53':'#38695b'));rect(xx+2,yy+3,36,1,'#79a17b14');if(map[y][x]===1){rect(xx,yy,T,T,(x+y)%2?'#ae9d7c':'#bfae88');rect(xx+3,yy+5,10,2,'#e4d1a5');rect(xx+26,yy+22,8,2,'#8d826d');rect(xx+7,yy+34,13,2,'#d5c49d')}else if(map[y][x]===2)tree(xx,yy,r);else if(map[y][x]===0){if(r<.48){rect(xx+9,yy+17,2,6,'#7eb48b');rect(xx+14,yy+20,3,3,r<.2?'#f5cf97':'#b8d4a0')}if(r>.86)rect(xx+28,yy+9,3,3,'#f1d69a')}}
for(const h of houses)house(h.x*T,h.y*T);let towerX=12*T-41,towerY=1*T-2;rect(towerX+7,towerY+25,71,104,'#a18c7d');rect(towerX+13,towerY+31,60,95,'#d1b9a0');rect(towerX+21,towerY+50,44,39,'#594d67');rect(towerX+25,towerY+54,36,31,'#e6c997');ctx.fillStyle='#74657c';ctx.beginPath();ctx.arc(towerX+43,towerY+70,13,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#f9e5ae';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(towerX+43,towerY+70);ctx.lineTo(towerX+43,towerY+60);ctx.moveTo(towerX+43,towerY+70);ctx.lineTo(towerX+51,towerY+73);ctx.stroke();poly([[towerX,towerY+31],[towerX+43,towerY-13],[towerX+86,towerY+31]],'#7b4b59');rect(towerX+28,towerY+105,30,23,'#62505b');
for(const o of objects){if(o.kind==='shard'&&!state.flags[o.id]){let ox=o.x*T+20,oy=o.y*T+16+Math.sin(t/350)*4;ctx.fillStyle='#f6dc8c33';ctx.beginPath();ctx.arc(ox,oy,18,0,Math.PI*2);ctx.fill();poly([[ox,oy-11],[ox+9,oy],[ox,oy+11],[ox-9,oy]],'#f9e9a6');poly([[ox,oy-9],[ox+7,oy],[ox,oy+2]],'#8be5f3')}else if(o.id==='child'&&!state.flags.child){rect(o.x*T+14,o.y*T+5,14,17,'#d9b59a');rect(o.x*T+11,o.y*T+2,20,8,'#b46c63');rect(o.x*T+12,o.y*T+22,18,12,'#a7a1d5')}else if(o.id==='toki')fairy(o.x*T+20,o.y*T+20,t)}hero(px,py,t);for(let i=0;i<16;i++){let xx=((i*113+t*.015)%(W*T)),yy=((i*171+t*.008)%(H*T));rect(xx,yy,2,2,'#f6e7ae88')}ctx.restore();const near=nearest();$('interact').style.display=near?'block':'none';$('interact').textContent=near?'✦ '+near.name+' を調べる':'';requestAnimationFrame(draw)}
function nearest(){return objects.filter(o=>!(o.kind==='shard'&&state.flags[o.id])&&Math.abs(o.x-state.x)+Math.abs(o.y-state.y)<=2).sort((a,b)=>(Math.abs(a.x-state.x)+Math.abs(a.y-state.y))-(Math.abs(b.x-state.x)+Math.abs(b.y-state.y)))[0]}
function hud(){ $('steps').textContent=state.steps;$('hp').textContent=state.hp;$('shards').textContent=state.shards;$('quest').textContent=state.won?'村に鐘の音が戻った。第一章クリア！':state.shards<3?'目的：村に散らばった「時の欠片」を3つ集めよう':'目的：北の時計塔で鐘守ゴーレムに挑もう';save()}
function panel(title,message,buttons=[['続ける',close]]){modal=true;$('veil').classList.remove('battle','hit','hurt');$('veil').style.display='flex';$('panelTitle').textContent=title;$('panelText').textContent=message;$('panelButtons').replaceChildren();$('bossArt').style.display='none';$('enemyBar').style.display='none';for(const [label,fn,secondary] of buttons){let b=document.createElement('button');b.textContent=label;if(secondary)b.className='sub';b.onclick=fn;$('panelButtons').append(b)}}function close(){ $('veil').classList.remove('battle','hit','hurt');modal=false;$('veil').style.display='none'}
function move(dx,dy){if(modal||state.won)return;let nx=state.x+dx,ny=state.y+dy;if(nx<1||ny<1||nx>=W-1||ny>=H-1||map[ny][nx]===2||map[ny][nx]===3)return;if(state.steps<=0){panel('最後の一歩','歩数が尽きた。時の欠片の光が、君を村の入口に戻す。',[['もう一度',()=>{state.x=12;state.y=15;state.steps=100;state.hp=30;close();hud()}]]);return}state.x=nx;state.y=ny;state.steps--;hud();if(state.steps===0)panel('世界が止まる','残り歩数が0になった。もう歩けない。',[['村の入口から再挑戦',()=>{state.x=12;state.y=15;state.steps=100;close();hud()}]])}
function collect(o){state.flags[o.id]=true;state.shards++;state.steps=Math.min(100,state.steps+24);hud();panel('✦ 時の欠片を見つけた',o.name+'から、失われた時間の光がこぼれた。\n\n残り歩数が24回復した。',[['光を胸にしまう',close]])}
function act(){if(modal)return;let o=nearest();if(!o){panel('風の声','草が静かに揺れている。\n村の奥には、時を止めた時計塔が見える。',[['戻る',close]]);return}if(o.kind==='shard')return collect(o);if(o.id==='child'){if(state.flags.child)return panel('少女ミオ','「ありがとう。あの鐘の音、もう一度聞きたいな」',[['うなずく',close]]);return panel('少女ミオ','「お母さんが教えてくれたの。鐘が鳴れば、みんなの明日が来るんだって」\n\n少女の涙が小さな星になった。',[['星を受け取る',()=>{state.flags.child=true;state.shards++;state.steps=Math.min(100,state.steps+24);hud();panel('✦ 3つ目の時の欠片','優しさが時間を動かす。\n残り歩数が24回復した。',[['進む',close]])}]])}if(o.id==='toki')return panel('時計の妖精 トキ','「アオ、歩数は命の残り時間じゃない。誰かと過ごした時間の数なんだよ」\n\n「時計塔の鐘を、もう一度鳴らそう」',[['行こう',close]]);if(o.id==='bell'){if(state.shards<3)return panel('閉ざされた時計塔','時計塔の扉には、3つのくぼみがある。\n時の欠片を3つ集めよう。',[['戻る',close]]);startBoss()}}
function startBoss(){bossHP=40;bossTurn=0;bossScreen('止まった鐘の番人が目を覚ました。\n「……明日を、欲するか」\n時の力：8歩 ／ 回復：12歩')}
function bossScreen(msg){panel('⚔ 鐘守ゴーレム',msg,[['⚔ 攻撃',()=>strike('attack')],['✦ 時の力',()=>strike('skill')],['🛡 防御',()=>strike('guard'),true],['💚 回復（+9）',()=>strike('heal'),true]]);$('veil').classList.add('battle');$('bossArt').style.display='block';$('enemyBar').style.display='block';$('enemyFill').style.width=Math.max(0,bossHP/40*100)+'%'}
function strike(type){if(type==='heal'&&state.steps<12){bossScreen('回復には12歩必要だ。');return}if(type==='heal'){state.steps-=12;state.hp=Math.min(30,state.hp+9)}let damage=type==='attack'?9:type==='skill'?15:0;if(type==='skill'&&state.steps<8){bossScreen('時の力には8歩必要だ。');return}if(type==='skill')state.steps-=8;bossHP=Math.max(0,bossHP-damage);if(bossHP<=0){state.won=true;state.steps=101;hud();return panel('第一章　鐘の鳴らない村','ゴーレムが崩れ、止まっていた時計の針が動き始めた。\n\nゴーン――。\n\n村に、明日の音が戻った。\n\nトキ「アオ……君は、101歩目を歩いたんだね」\n\n第一章・試作版クリア。',[['もう一度遊ぶ',()=>{state={x:12,y:15,steps:100,hp:30,shards:0,flags:{},won:false};close();hud()}]])}bossTurn++;let enemy=bossTurn%3===0?11:6;let received=type==='guard'?Math.max(1,enemy-5):enemy;state.hp=Math.max(0,state.hp-received);hud();if(state.hp<=0)return panel('時がほどける','アオは倒れた。しかしトキが残った光を集め、旅の始まりへ送り返した。',[['再挑戦',()=>{state.hp=30;state.steps=100;state.x=12;state.y=15;close();hud()}]]);bossScreen((type==='guard'?'盾で攻撃を受け止めた。':type==='heal'?'時の力で傷を癒やした。':type==='skill'?'時の力が敵を切り裂いた！':'剣が敵に命中した！')+'\n与えたダメージ：'+damage+'　受けたダメージ：'+received+'\n敵の残りHP：'+bossHP+'/40');const veil=$('veil');veil.classList.remove('hit','hurt');void veil.offsetWidth;veil.classList.add(type==='guard'||type==='heal'?'hurt':'hit');setTimeout(()=>veil.classList.remove('hit','hurt'),350)}
$('action').onclick=act;$('journal').onclick=()=>panel('冒険の手帳','時の欠片：'+state.shards+'/3\n残り歩数：'+state.steps+'\n\n井戸・星灯りの花・少女ミオを探そう。\n\n欠片を3つ集めたら、北の時計塔へ。',[['冒険に戻る',close],['最初からやり直す',()=>panel('最初から？','セーブデータを初期化します。',[['やり直す',()=>{state={x:12,y:15,steps:100,hp:30,shards:0,flags:{},won:false};close();hud()}],['キャンセル',close,true]]) ,true]]);
$('sound').onclick=()=>{sound=!sound;$('sound').innerHTML=sound?'♫<br>音 ON':'♫<br>音 OFF';if(sound){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=523;g.gain.value=.025;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.14)}catch(e){}}};
for(const b of document.querySelectorAll('[data-dir]')){let [dx,dy]=b.dataset.dir.split(',').map(Number);let interval=null;const stop=()=>{clearInterval(interval);interval=null};b.addEventListener('pointerdown',e=>{e.preventDefault();move(dx,dy);stop();interval=setInterval(()=>move(dx,dy),155)});for(const ev of ['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,stop)}
document.addEventListener('keydown',e=>{if(modal)return;const k={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};if(k[e.key]){e.preventDefault();if(performance.now()-lastMove>100){move(...k[e.key]);lastMove=performance.now()}}else if(e.key===' '||e.key==='Enter'){e.preventDefault();act()}});
hud();requestAnimationFrame(draw);if(!state.won&&!state.flags.intro)setTimeout(()=>panel('あと100歩の世界','――世界が止まった日、少年アオには100歩だけが残された。\n\n時計の妖精トキとともに、鐘の鳴らない村の時間を取り戻そう。\n\n十字キーで移動。近くの光や人物を「調べる」。',[['冒険をはじめる',()=>{state.flags.intro=true;save();close()}]]),350);
</script></body></html>
